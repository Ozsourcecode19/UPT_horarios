[package]
name = "upt-horarios"
version = "0.1.0"
description = "Aplicación de escritorio del Sistema de Horarios UPT Bolívar"
authors = ["UPT Bolívar"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
